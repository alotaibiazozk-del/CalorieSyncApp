name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Add iOS Platform & Install Pods
        run: |
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install || true

      - name: Build Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          fi

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: ios/App/build/Build/Products/Release-iphoneos/App.app